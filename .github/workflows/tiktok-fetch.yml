name: tiktok-fetch

on:
  workflow_dispatch:
    inputs:
      url:
        description: "TikTok share URL"
        required: true
        default: "https://vm.tiktok.com/ZSpsPVxj9/"
      target_branch:
        description: "Branch to commit the downloaded files to"
        required: true
        default: "arena/82e65b5b-olaniyan-samuel-akorede"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve + download
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads
          set +e
          curl -sS -L --max-time 90 -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            "https://tikwm.com/api/?url=${URL}&hd=1" -o downloads/meta_tikwm.json
          curl -sS -L --max-time 90 -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            "https://www.tikwm.com/api/?url=${URL}&hd=1" -o downloads/meta_tikwm_www.json
          ls -la downloads
          for f in downloads/meta_*.json; do echo "=== $f"; head -c 1500 "$f"; echo; done

          python3 - <<'PY'
          import json, os, glob, subprocess, urllib.request, traceback

          data = None
          for f in sorted(glob.glob("downloads/meta_*.json")):
              try:
                  j = json.load(open(f))
              except Exception:
                  continue
              if isinstance(j, dict) and j.get("data"):
                  data = j["data"]
                  print("using", f)
                  break

          report = []
          if not data:
              report.append("NO DATA PARSED")
          else:
              report.append("DESC: %s" % data.get("title"))
              report.append("AUTHOR: @%s" % (data.get("author") or {}).get("unique_id"))
              report.append("DURATION: %s" % data.get("duration"))
              report.append("MUSIC: %s" % (data.get("music_info") or {}).get("title"))
              json.dump(data, open("downloads/metadata.json", "w"), indent=2)

              def grab(url, dest):
                  if not url:
                      report.append("missing url for " + dest)
                      return
                  if url.startswith("/"):
                      url = "https://tikwm.com" + url
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=180) as r, open(dest, "wb") as fh:
                          fh.write(r.read())
                      report.append("saved %s (%d bytes)" % (dest, os.path.getsize(dest)))
                  except Exception as e:
                      report.append("FAILED %s: %r" % (dest, e))

              grab(data.get("hdplay") or data.get("play"), "downloads/video.mp4")
              if os.path.exists("downloads/video.mp4"):
                  subprocess.run(["ffmpeg", "-y", "-i", "downloads/video.mp4", "-vn",
                                  "-acodec", "libmp3lame", "-q:a", "2", "downloads/audio.mp3"],
                                 check=False, capture_output=True)
                  subprocess.run(["ffprobe", "-v", "error", "-show_format", "-show_streams",
                                  "downloads/video.mp4"], check=False,
                                 stdout=open("downloads/ffprobe.txt", "w"), stderr=subprocess.STDOUT)

          open("downloads/REPORT.txt", "w").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Commit results to branch
        run: |
          git config user.name "tiktok-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git stash list
          BRANCH="${{ inputs.target_branch }}"
          git fetch origin "$BRANCH"
          git checkout -f FETCH_HEAD
          git add -f downloads
          git commit -m "data: TikTok download for ${{ inputs.url }}" || echo "nothing to commit"
          git push origin HEAD:"$BRANCH"
