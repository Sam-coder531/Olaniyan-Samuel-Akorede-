name: tiktok-fetch

on:
  workflow_dispatch:
    inputs:
      url:
        description: "TikTok share URL"
        required: true
        default: "https://vm.tiktok.com/ZSpsPVxj9/"
      target_branch:
        description: "Branch to commit the downloaded files to"
        required: true
        default: "arena/82e65b5b-olaniyan-samuel-akorede"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve + download (never fails)
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads
          exec 2>&1
          set -x
          LOG=downloads/REPORT.txt
          : > "$LOG"

          echo "### yt-dlp attempt" | tee -a "$LOG"
          python3 -m pip install --quiet --disable-pip-version-check -U yt-dlp curl_cffi >> "$LOG" 2>&1 || true
          yt-dlp --version >> "$LOG" 2>&1 || true
          yt-dlp --no-playlist --write-info-json --write-thumbnail \
                 --merge-output-format mp4 -o "downloads/video.%(ext)s" \
                 --print-json "$TARGET_URL" >> downloads/ytdlp.log 2>&1 || true
          yt-dlp --no-playlist -f "bv*+ba/b" --merge-output-format mp4 \
                 -o "downloads/video.%(ext)s" "$TARGET_URL" >> downloads/ytdlp.log 2>&1 || true
          tail -40 downloads/ytdlp.log >> "$LOG" 2>&1 || true

          echo "### resolver API attempt" | tee -a "$LOG"
          for base in "https://tikwm.com" "https://www.tikwm.com"; do
            curl -sS -L --max-time 60 -A "Mozilla/5.0" \
              "$base/api/?url=${TARGET_URL}&hd=1" -o downloads/meta.json || true
            head -c 800 downloads/meta.json >> "$LOG" 2>&1 || true
            echo >> "$LOG"
            if [ -s downloads/meta.json ] && grep -q '"play"' downloads/meta.json; then
              cp downloads/meta.json downloads/meta_good.json
              break
            fi
          done

          python3 - <<'PY' >> "$LOG" 2>&1 || true
          import glob, json, os, subprocess, urllib.request
          try:
              data = None
              if os.path.exists("downloads/meta_good.json"):
                  data = json.load(open("downloads/meta_good.json")).get("data")
              print("### parsing resolver data:", bool(data))
              if data:
                  print("DESC:", data.get("title"))
                  print("AUTHOR: @%s" % (data.get("author") or {}).get("unique_id"))
                  print("DURATION:", data.get("duration"))
                  json.dump(data, open("downloads/metadata.json", "w"), indent=2)
                  if not os.path.exists("downloads/video.mp4"):
                      u = data.get("hdplay") or data.get("play") or ""
                      if u.startswith("/"):
                          u = "https://tikwm.com" + u
                      req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=180) as r, open("downloads/video.mp4", "wb") as fh:
                          fh.write(r.read())
                      print("saved downloads/video.mp4", os.path.getsize("downloads/video.mp4"))
          except Exception as e:
              print("resolver error:", repr(e))
          try:
              if os.path.exists("downloads/video.mp4"):
                  subprocess.run(["ffmpeg", "-y", "-i", "downloads/video.mp4", "-vn",
                                  "-acodec", "libmp3lame", "-q:a", "2", "downloads/audio.mp3"],
                                 check=False, capture_output=True)
                  subprocess.run(["ffprobe", "-v", "error", "-show_format", "-show_streams",
                                  "downloads/video.mp4"], check=False,
                                 stdout=open("downloads/ffprobe.txt", "w"), stderr=subprocess.STDOUT)
          except Exception as e:
              print("ffmpeg error:", repr(e))
          PY

          ls -la downloads >> "$LOG" 2>&1 || true
          exit 0

      - name: Commit results to branch
        run: |
          git config user.name "tiktok-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${{ inputs.target_branch }}"
          git fetch origin "$BRANCH"
          git checkout -f FETCH_HEAD
          git add -f downloads
          git commit -m "data: TikTok download for ${{ inputs.url }}" || echo "nothing to commit"
          git push origin HEAD:"$BRANCH"
