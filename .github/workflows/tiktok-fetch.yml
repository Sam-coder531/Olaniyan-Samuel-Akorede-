name: tiktok-fetch

on:
  workflow_dispatch:
    inputs:
      url:
        description: "TikTok share URL"
        required: true
        default: "https://vm.tiktok.com/ZSpsPVxj9/"
      target_branch:
        description: "Branch to commit the downloaded files to"
        required: true
        default: "arena/82e65b5b-olaniyan-samuel-akorede"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download with yt-dlp
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          set -x
          python3 -m pip install --quiet --disable-pip-version-check -U yt-dlp
          rm -rf media raw
          mkdir -p media raw

          ID=$(yt-dlp --no-warnings --get-id "$TARGET_URL")
          SLUG=$(yt-dlp --no-warnings --get-id "$TARGET_URL" >/dev/null; echo "$TARGET_URL")
          echo "ID=$ID"
          echo "$ID" > raw/id.txt

          yt-dlp --no-warnings --write-info-json --skip-download -o "raw/%(id)s.%(ext)s" "$TARGET_URL"

          # browser-friendly H.264 mp4 (best avc1 video + best audio merged by yt-dlp)
          yt-dlp --no-warnings -f "bv*[vcodec*=avc1]+ba/bv*[vcodec*=h264]+ba/b" \
                 --merge-output-format mp4 --remux-video mp4 \
                 -o "media/$ID.mp4" "$TARGET_URL" || \
          yt-dlp --no-warnings -f "b" --remux-video mp4 -o "media/$ID.mp4" "$TARGET_URL"

          # original audio track (tiktok serves an mp3 directly)
          yt-dlp --no-warnings -f "audio" -o "media/$ID-audio.%(ext)s" "$TARGET_URL" || true

          # cover image
          curl -sS -L --max-time 60 -o "media/$ID-cover.jpg" \
            "$(python3 -c "
          import json,glob
          f=sorted(glob.glob('raw/*.info.json'))[0]
          d=json.load(open(f))
          print(d.get('thumbnail') or '')
          ")" || true

          ls -la media raw
          exit 0

      - name: Write summary
        run: |
          python3 - <<'PY'
          import glob, json, os, datetime

          f = sorted(glob.glob("raw/*.info.json"))[0]
          d = json.load(open(f))
          vid = d.get("id")
          up = d.get("upload_date") or ""
          try:
              posted = datetime.date(int(up[:4]), int(up[4:6]), int(up[6:8])).isoformat()
          except Exception:
              posted = up

          lines = [
              "# TikTok download",
              "",
              "| field | value |",
              "| --- | --- |",
              "| Author | @%s |" % d.get("uploader"),
              "| Video ID | %s |" % vid,
              "| Caption | %s |" % (d.get("description") or "").replace("\n", " ").strip(),
              "| Posted | %s |" % posted,
              "| Duration | %ss |" % d.get("duration"),
              "| Views | %s |" % d.get("view_count"),
              "| Likes | %s |" % d.get("like_count"),
              "| Comments | %s |" % d.get("comment_count"),
              "| Shares | %s |" % d.get("repost_count"),
              "| Saves | %s |" % d.get("save_count"),
              "| Sound | %s |" % d.get("track"),
              "| Page | %s |" % d.get("webpage_url"),
              "",
              "## Files",
              "",
          ]
          for p in sorted(glob.glob("media/*")):
              lines.append("- `%s` (%.1f KB)" % (p, os.path.getsize(p) / 1024))
          lines += ["", "Downloaded %s UTC with yt-dlp." % datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M")]
          open("media/README.md", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Commit results to branch
        run: |
          git config user.name "tiktok-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${{ inputs.target_branch }}"
          git fetch origin "$BRANCH"
          git checkout -f FETCH_HEAD
          rm -rf downloads
          git add -f media
          git commit -m "data: add TikTok video @ $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin HEAD:"$BRANCH"
