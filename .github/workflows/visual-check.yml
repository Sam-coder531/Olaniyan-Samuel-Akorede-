name: visual-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: true
        default: "main"
      artifact_branch:
        description: "Branch to commit screenshots to"
        required: true
        default: "visual-check"

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Install playwright (use runner's Chrome)
        run: |
          npm install --no-save playwright@1.56.0
          # Ubuntu runners ship Chrome stable; skip the CDN browser download
          google-chrome --version || chromium-browser --version || true

      - name: Build
        run: npm run build

      - name: Serve
        run: |
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3000; then echo "up"; break; fi
            sleep 1
          done
          cat /tmp/server.log | tail -5

      - name: Screenshot the film
        run: node scripts/shoot.mjs
        env:
          TARGET_URL: http://127.0.0.1:3000

      - name: Publish screenshots to branch
        if: always()
        run: |
          cat shots/report.txt || true
          # keep the fresh screenshots OUTSIDE the repo while we switch branches,
          # otherwise stash/checkout races silently leave the old images in place
          rm -rf /tmp/fresh && mkdir -p /tmp/fresh
          cp -r shots/. /tmp/fresh/ 2>/dev/null || true
          cp /tmp/server.log /tmp/fresh/server.log 2>/dev/null || true
          md5sum /tmp/fresh/*.png > /tmp/fresh/md5.txt 2>/dev/null || true
          cat /tmp/fresh/md5.txt || true

          git config user.name "visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "${{ inputs.artifact_branch }}" || true
          rm -rf shots
          git checkout -B "${{ inputs.artifact_branch }}" origin/"${{ inputs.artifact_branch }}" 2>/dev/null \
            || git checkout -B "${{ inputs.artifact_branch }}"
          rm -rf shots && mkdir -p shots
          cp -r /tmp/fresh/. shots/
          git add -f shots
          git commit -m "shots: $(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ inputs.ref }}" || echo "nothing"
          git push --force origin "${{ inputs.artifact_branch }}"
